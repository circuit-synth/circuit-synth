processes:
  git:
    type: shell
    actions: [exec]
    args: [[submodule, update, --remote, submodules/digikey-kicad], [rev-parse, HEAD], [describe, --exact-match, --tags, HEAD],
      [status, --porcelain], [pull]]
    params:
      caller: [subprocess.run]
      shell: ["False", "False", "False", "False", "False"]
  python:
    type: shell
    actions: [exec]
    args: [[str(self.python_file_path)]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
      ref: sys.executable
  rg:
    type: shell
    actions: [exec]
    args: [[-l, '\(symbol\s+"{sym_name}"', str(kicad_dir), --type-add, 'kicad:*.kicad_sym', --type, kicad]]
    params:
      caller: [subprocess.run]
      shell: ["False"]

