files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.kicad_sym', '*{query}*.kicad_mod', '*.json', '*.lib', '*.kicad_httplib', '*.kicad_sch']
      caller: [_search_modern_symbols, _search_footprints, clear_expired, clear_all, _search_digikey_symbols, _search_digikey_footprints,
        _build_complete_index, _python_grep_search, _load_http_configs, _fix_all_schematic_project_names]
  .cache:
    type: literal
    actions: [read]
    params:
      caller: [__init__, _get_cache_dir]
      path: [Path.cwd]
  .circuit-synth:
    type: literal
    actions: [read]
    params:
      caller: [__init__]
      path: [Path.cwd]
  .json:
    type: literal
    actions: [read, write]
    params:
      caller: [get, set, tempfile.NamedTemporaryFile]
      path: [self.cache_dir]
  .kicad:
    type: literal
    actions: [read]
    params:
      caller: [_load_http_configs]
      path: [Path.home]
  .kicad_pcb:
    type: literal
    actions: [read]
    params:
      caller: [validate_design, _update_existing_project, generate_project, generate_pcb_from_schematics]
      path: [project_path]
  .kicad_pro:
    type: literal
    actions: [read]
    params:
      caller: [write_positioned_schematic, generate_schematic, validate_design, _check_existing_project, _update_existing_project,
        _prepare_blank_project, _update_kicad_pro]
      path: [self.output_dir]
  .kicad_sch:
    type: literal
    actions: [read]
    params:
      caller: [write_positioned_schematic, generate_schematic, validate_design, _check_existing_project, _add_bounding_boxes_to_schematic,
        generate_project, _collision_place_all_circuits, _write_cover_sheet, _update_kicad_pro]
      path: [self.output_dir]
  .kicad_sym:
    type: literal
    actions: [read]
    params:
      caller: [_find_library_file, _find_symbol_file_by_name]
      path: [Path.cwd]
  .net:
    type: literal
    actions: [read]
    params:
      caller: [generate_project, _generate_netlist]
      path: [Path]
  /tmp/circuit_synth_debug.log:
    type: literal
    actions: [write, read]
    params:
      caller: [open, generate_s_expr]
      alias: [f]
  backup_dir:
