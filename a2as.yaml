manifest:
  version: "0.1.3"
  schema: https://a2as.org/cert/schema
  subject:
    name: circuit-synth/circuit-synth
    source: https://github.com/circuit-synth/circuit-synth
    branch: main
    commit: "fb2bd306"
    scope: [src/circuit_synth/fast_generation/adk_tools.py, src/circuit_synth/fast_generation/models.py, src/circuit_synth/fast_generation/pin_finder.py]
  issued:
    by: A2AS.org
    at: '2026-02-11T16:33:38Z'
    url: https://a2as.org/certified/agents/circuit-synth/circuit-synth
  signatures:
    digest: sha256:UndfEhYV_svvr5gqygoa7pJ47LZufyor52f24v2D7nU
    key: ed25519:Zwx2K5L6ACIaLFT9o5EFQTY4gAigTLSxa13QSd4ljKQ
    sig: ed25519:7bQM7OnhWySrQK6WWt7Nb_O159M_dzO0KnwiGrCSDfpRVCwCZldgPPgLnChZaCR_IQozQEO-gkO10NoIJSeEAg

agents:
  agent._setup_agents.0:
    type: factory
    models: [gemini-2.5-flash]
    tools: [tools]
    params:
      name: circuit_generator
      instruction: [You are a circuit design specialist. Generate production-ready, KiCad circuit-synth code following electrical
          engineering best practices., 'CRITICAL: Always use these tools before generating circuits:', 1. find_symbol_tool_function()
          - Find correct KiCad symbols, 2. find_footprint_tool_function() - Find matching footprints, 3. find_pins_tool_function()
          - Get exact pin names, This ensures you use verified components with correct pin names.]
      description: Primary circuit code generation
      function: _setup_agents
      instance: agent._setup_agents
  agent._setup_agents.1:
    type: factory
    models: [gemini-2.5-flash]
    tools: [tools]
    params:
      name: component_validator
      instruction: [Validate that all components exist in KiCad libraries and, verify electrical connections are correct.
          Use find_pins_tool_function to verify pin names.]
      description: Component and connection validation
      function: _setup_agents
      instance: agent._setup_agents
  agent._setup_agents.2:
    type: factory
    models: [gemini-2.5-flash]
    params:
      name: pattern_specialist
      instruction: ['Specialize in common circuit patterns: MCU boards, sensor', 'integration, motor control, power management.']
      description: Circuit pattern expertise
      function: _setup_agents
      instance: agent._setup_agents

models:
  gemini-2.5-flash:
    type: literal
    agents: [agent._setup_agents.0, agent._setup_agents.1, agent._setup_agents.2]

tools:
  tools:
    type: function
    agents: [agent._setup_agents.0, agent._setup_agents.1]
    params:
      dynamic: "True"

